{{- if and .Values.metrics.secure .Values.metrics.authDelegator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-metrics-auth-delegator" (include "sn-operator.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "sn-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "sn-operator.serviceAccountName" . }}
  namespace: {{ include "sn-operator.namespace" . }}
{{- end }}
