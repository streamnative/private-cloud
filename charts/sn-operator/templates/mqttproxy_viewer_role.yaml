# permissions for end users to view mqttproxies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sn-operator
    app.kubernetes.io/managed-by: kustomize
  name: mqttproxy-viewer-role
rules:
- apiGroups:
  - k8s.streamnative.io
  resources:
  - mqttproxies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k8s.streamnative.io
  resources:
  - mqttproxies/status
  verbs:
  - get
